services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emanuelbarboza-web
    restart: unless-stopped
    ports:
      - "3002:3002"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      PORT: "3002"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3002"