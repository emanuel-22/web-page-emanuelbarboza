services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emanuelbarboza-web
    restart: unless-stopped
    # The Dockerfile CMD builds/serves the production bundle; for local dev we
    # override it to run `next dev` against the bind-mounted source (hot reload).
    command: npm run dev
    ports:
      - "3002:3002"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      PORT: "3002"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3002"