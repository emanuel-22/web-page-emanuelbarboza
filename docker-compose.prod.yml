services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://emanuelbarboza.com

    container_name: emanuelbarboza-web
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: "3000"

    # Solo loopback: la única puerta pública es el Nginx del host, que hace
    # proxy_pass a 127.0.0.1:3002 según el dominio. (Igual que argislab.)
    ports:
      - "127.0.0.1:3002:3000"

    # Endurecimiento: sin capabilities, sin escalar privilegios, filesystem de
    # solo lectura salvo lo que Next necesita escribir (tmpfs, se pierde al reiniciar).
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
      - /app/.next/cache